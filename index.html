<!DOCTYPE html>
<!--
    Fernando Costa — Personal profile
    Concept: "Quiet Luxury Digital" · handcrafted with HTML, CSS and JavaScript.
    No frameworks · no libraries · no build step.
-->
<html lang="en" class="no-js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Progressive enhancement: swap the no-js flag before first paint -->
    <script>document.documentElement.classList.replace("no-js", "js");</script>

    <!--
        ============================================================
        SITE URL — single source of truth for absolute links.
        Update these four tags if the domain changes
        (fallback: your-project.vercel.app).
        ============================================================
    -->

    <!-- Primary meta -->
    <title>Fernando Costa — @feacostaa</title>
    <meta name="description"
        content="The official home of Fernando Costa (@feacostaa). Follow along on Instagram, TikTok, YouTube, LinkedIn and GitHub. Success tomorrow starts with effort today.">
    <meta name="author" content="Fernando Costa">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#060B14">
    <meta name="color-scheme" content="dark">
    <link rel="canonical" href="https://feacostaa.com/">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Fernando Costa">
    <meta property="og:title" content="Fernando Costa — @feacostaa">
    <meta property="og:description"
        content="Follow Fernando Costa across Instagram, TikTok, YouTube, LinkedIn and GitHub.">
    <meta property="og:url" content="https://feacostaa.com/">
    <meta property="og:image" content="https://feacostaa.com/assets/profile/fernando-costa.jpg">
    <meta property="og:image:alt" content="Portrait of Fernando Costa">
    <meta property="og:locale" content="en_US">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Fernando Costa — @feacostaa">
    <meta name="twitter:description"
        content="Follow Fernando Costa across Instagram, TikTok, YouTube, LinkedIn and GitHub.">
    <meta name="twitter:image" content="https://feacostaa.com/assets/profile/fernando-costa.jpg">
    <meta name="twitter:image:alt" content="Portrait of Fernando Costa">

    <!-- Favicon -->
    <link rel="icon" href="assets/favicon/favicon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/favicon/favicon.svg">

    <!-- Preload self-hosted fonts (crossorigin required even same-origin) -->
    <link rel="preload" href="assets/fonts/clash-display-700.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="assets/fonts/inter-variable-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Styles — linked in cascade order (no @import, avoids a request waterfall) -->
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/typography.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

    <!-- App logic — ES modules are deferred by default -->
    <script type="module" src="js/main.js"></script>
</head>

<body>
    <!-- Skip link for keyboard users -->
    <a class="skip-link" href="#social">Skip to social links</a>

    <!--
        SVG icon sprite (defined once, referenced with <use>).
        Kept out of the accessibility tree and off-screen.
    -->
    <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
        <symbol id="icon-instagram" viewBox="0 0 24 24">
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5" />
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z" />
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5" />
        </symbol>
        <symbol id="icon-tiktok" viewBox="0 0 24 24">
            <path
                d="M21 7.917v4.034a9.948 9.948 0 0 1 -5 -1.951v4.5a6.5 6.5 0 1 1 -8 -6.326v4.326a2.5 2.5 0 1 0 4 2v-11.5h4.083a6.005 6.005 0 0 0 4.917 4.917" />
        </symbol>
        <symbol id="icon-youtube" viewBox="0 0 24 24">
            <path
                d="M2.5 17a24.12 24.12 0 0 1 0-10 2 2 0 0 1 1.4-1.4 49.56 49.56 0 0 1 16.2 0A2 2 0 0 1 21.5 7a24.12 24.12 0 0 1 0 10 2 2 0 0 1-1.4 1.4 49.55 49.55 0 0 1-16.2 0A2 2 0 0 1 2.5 17" />
            <path d="m10 15 5-3-5-3z" />
        </symbol>
        <symbol id="icon-linkedin" viewBox="0 0 24 24">
            <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z" />
            <rect width="4" height="12" x="2" y="9" />
            <circle cx="4" cy="4" r="2" />
        </symbol>
        <symbol id="icon-github" viewBox="0 0 24 24">
            <path
                d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4" />
            <path d="M9 18c-4.51 2-5-2-7-2" />
        </symbol>
        <symbol id="icon-arrow" viewBox="0 0 24 24">
            <path d="M7 17 17 7" />
            <path d="M7 7h10v10" />
        </symbol>
    </svg>

    <!-- Ambient animated background (decorative only) -->
    <div class="background" aria-hidden="true"></div>

    <!-- Page header: subtle corner brand -->
    <header class="site-header" aria-label="Brand">
        <a class="brand" href="#main" aria-label="Fernando Costa — back to top">
            <span class="brand__mark" aria-hidden="true">FC</span>
            <span class="brand__name">Fernando Costa</span>
        </a>
    </header>

    <!-- Main: identity (left) + social buttons (right) -->
    <main class="layout" id="main">

        <!-- Hero / identity column -->
        <section class="profile" id="hero" aria-label="Profile">
            <picture>
                <source type="image/webp" srcset="assets/profile/fernando-costa.webp">
                <img class="profile__avatar" data-animate src="assets/profile/fernando-costa.jpg"
                    alt="Portrait of Fernando Costa" width="512" height="512" fetchpriority="high" decoding="async">
            </picture>

            <h1 class="profile__title" data-animate style="--stagger: 50ms">Fernando Costa</h1>
            <p class="profile__subtitle" data-animate style="--stagger: 100ms">@feacostaa</p>
            <p class="profile__bio" data-animate style="--stagger: 150ms">Success tomorrow starts with effort today.</p>

            <!-- Compact social icons -->
            <nav class="social-icons" data-animate style="--stagger: 200ms" aria-label="Quick social links">
                <a class="social-icons__link" href="https://www.instagram.com/feacostaa" target="_blank"
                    rel="noopener noreferrer" title="Fernando Costa on Instagram"
                    aria-label="Instagram (opens in a new tab)">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-instagram" /></svg>
                </a>
                <a class="social-icons__link" href="https://www.tiktok.com/@feacostaa" target="_blank"
                    rel="noopener noreferrer" title="Fernando Costa on TikTok"
                    aria-label="TikTok (opens in a new tab)">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-tiktok" /></svg>
                </a>
                <a class="social-icons__link" href="https://www.youtube.com/channel/UCaQoYGIDrmIsk61R3DFdDEQ"
                    target="_blank" rel="noopener noreferrer" title="Fernando Costa on YouTube"
                    aria-label="YouTube (opens in a new tab)">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-youtube" /></svg>
                </a>
                <a class="social-icons__link" href="https://www.linkedin.com/in/fernandoazevedocosta/"
                    target="_blank" rel="noopener noreferrer" title="Fernando Costa on LinkedIn"
                    aria-label="LinkedIn (opens in a new tab)">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-linkedin" /></svg>
                </a>
                <a class="social-icons__link" href="https://github.com/FerDevSecOps" target="_blank"
                    rel="noopener noreferrer" title="Fernando Costa on GitHub"
                    aria-label="GitHub (opens in a new tab)">
                    <svg class="icon" aria-hidden="true" focusable="false"><use href="#icon-github" /></svg>
                </a>
            </nav>
        </section>

        <!-- Primary social buttons -->
        <nav class="social-links" id="social" aria-label="Social media profiles">
            <a class="social-button" data-animate style="--stagger: 250ms" href="https://www.instagram.com/feacostaa"
                target="_blank" rel="noopener noreferrer" title="Follow Fernando Costa on Instagram"
                aria-label="Instagram — follow (opens in a new tab)">
                <span class="social-button__icon" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-instagram" /></svg>
                </span>
                <span class="social-button__body">
                    <span class="social-button__label">Instagram</span>
                    <span class="social-button__meta">Follow</span>
                </span>
                <span class="social-button__arrow" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-arrow" /></svg>
                </span>
            </a>

            <a class="social-button" data-animate style="--stagger: 300ms" href="https://www.tiktok.com/@feacostaa"
                target="_blank" rel="noopener noreferrer" title="Follow Fernando Costa on TikTok"
                aria-label="TikTok — follow (opens in a new tab)">
                <span class="social-button__icon" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-tiktok" /></svg>
                </span>
                <span class="social-button__body">
                    <span class="social-button__label">TikTok</span>
                    <span class="social-button__meta">Follow</span>
                </span>
                <span class="social-button__arrow" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-arrow" /></svg>
                </span>
            </a>

            <a class="social-button" data-animate style="--stagger: 350ms"
                href="https://www.youtube.com/channel/UCaQoYGIDrmIsk61R3DFdDEQ" target="_blank"
                rel="noopener noreferrer" title="Subscribe to Fernando Costa on YouTube"
                aria-label="YouTube — subscribe (opens in a new tab)">
                <span class="social-button__icon" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-youtube" /></svg>
                </span>
                <span class="social-button__body">
                    <span class="social-button__label">YouTube</span>
                    <span class="social-button__meta">Subscribe</span>
                </span>
                <span class="social-button__arrow" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-arrow" /></svg>
                </span>
            </a>

            <a class="social-button" data-animate style="--stagger: 400ms"
                href="https://www.linkedin.com/in/fernandoazevedocosta/" target="_blank" rel="noopener noreferrer"
                title="Connect with Fernando Costa on LinkedIn"
                aria-label="LinkedIn — connect (opens in a new tab)">
                <span class="social-button__icon" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-linkedin" /></svg>
                </span>
                <span class="social-button__body">
                    <span class="social-button__label">LinkedIn</span>
                    <span class="social-button__meta">Connect</span>
                </span>
                <span class="social-button__arrow" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-arrow" /></svg>
                </span>
            </a>

            <a class="social-button" data-animate style="--stagger: 450ms" href="https://github.com/FerDevSecOps"
                target="_blank" rel="noopener noreferrer" title="Follow Fernando Costa on GitHub"
                aria-label="GitHub — follow (opens in a new tab)">
                <span class="social-button__icon" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-github" /></svg>
                </span>
                <span class="social-button__body">
                    <span class="social-button__label">GitHub</span>
                    <span class="social-button__meta">Follow</span>
                </span>
                <span class="social-button__arrow" aria-hidden="true">
                    <svg class="icon" focusable="false"><use href="#icon-arrow" /></svg>
                </span>
            </a>
        </nav>
    </main>

    <!-- Footer -->
    <footer class="footer" aria-label="Footer">
        <p class="footer__text">&copy; <span data-year>2026</span> Fernando Costa. All rights reserved.</p>
        <p class="footer__note">Handcrafted with HTML, CSS &amp; JavaScript.</p>
    </footer>
</body>

</html>
